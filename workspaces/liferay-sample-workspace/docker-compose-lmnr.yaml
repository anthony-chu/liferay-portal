# Source: https://github.com/lmnr-ai/lmnr/blob/615dc130da78cdbe8507dc8a91a7ef34ba0c0978/docker-compose.yml
# Modifications: 2026-11-05 by Liferay, Inc.: generate secrets and DB passwords
# in a new init service instead of reading them from the environment; set fixed
# ClickHouse and Postgres user names; bind ports to 127.0.0.1 and remap them to
# 9xxx; pin the lmnr images to v0.2.5; update Quickwit to v0.9.1 and build it
# from quickwit/Dockerfile, which adds curl for the health check; disable
# Laminar telemetry; remove the LLM/cloud provider settings,
# SHARED_SECRET_TOKEN, settings left at their default values, and the
# ClickHouse ulimits (not permitted under rootless Docker); reorder keys;
# reword the comments; make it an override of the workspace's
# docker-compose.yaml, with paths relative to the workspace; add the eval
# portal properties and OSGi configs to the liferay service as environment
# variables.

# This compose file is a lightweight version of docker-compose-full.yml.
# It is intended to be used for local quickstarts.
# It includes the frontend, app-server, ClickHouse, PostgreSQL, Quickwit, and
# init services, but not RabbitMQ.

services:
    app-server:
        command:
            -   sh
            -   -euc
            -   |
                export AEAD_SECRET_KEY="$$(cat /run/lmnr-secrets/aead_secret_key)"
                export CLICKHOUSE_PASSWORD="$$(cat /run/lmnr-secrets/clickhouse_password)"
                export CLICKHOUSE_RO_PASSWORD="$$(cat /run/lmnr-secrets/clickhouse_ro_password)"
                export DATABASE_URL="postgres://postgres:$$(cat /run/lmnr-secrets/postgres_password)@postgres:5432/postgres"
                exec ./app-server
        depends_on:
            clickhouse:
                condition: service_started
            init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            quickwit:
                condition: service_healthy
        environment:
            # This must match the read only user in clickhouse-profiles-config.xml.

            CLICKHOUSE_RO_USER: ch_ro_user
            CLICKHOUSE_URL: http://clickhouse:8123
            CLICKHOUSE_USER: ch_user
            # LITE disables the runtime dependency on RabbitMQ.

            ENVIRONMENT: LITE
            QUICKWIT_INGEST_URL: http://quickwit:7281
            QUICKWIT_SEARCH_URL: http://quickwit:7280
        image: ghcr.io/lmnr-ai/app-server:v0.2.5
        ports:
            -   "127.0.0.1:9000:8000"
            -   "127.0.0.1:9001:8001"
            -   "127.0.0.1:9002:8002"
        pull_policy: always
        volumes:
            -   init-secrets:/run/lmnr-secrets:ro
    clickhouse:
        container_name: clickhouse
        depends_on:
            init:
                condition: service_completed_successfully
        entrypoint:
            -   sh
            -   -euc
            -   |
                export CLICKHOUSE_PASSWORD="$$(cat /run/lmnr-secrets/clickhouse_password)"
                export CLICKHOUSE_RO_PASSWORD="$$(cat /run/lmnr-secrets/clickhouse_ro_password)"
                exec /entrypoint.sh
        environment:
            CLICKHOUSE_USER: ch_user
        image: clickhouse/clickhouse-server:26.5
        pull_policy: always
        volumes:
            -   source: ./lmnr/compose/clickhouse-profiles-config.xml
                target: /etc/clickhouse-server/users.d/lmnr.xml
                type: bind
            -   source: ./lmnr/compose/clickhouse-server-config.xml
                target: /etc/clickhouse-server/config.d/lmnr.xml
                type: bind
            -   source: clickhouse-data
                target: /var/lib/clickhouse
                type: volume
            -   source: clickhouse-logs
                target: /var/log/clickhouse-server
                type: volume
            -   read_only: true
                source: init-secrets
                target: /run/lmnr-secrets
                type: volume
    frontend:
        command:
            -   sh
            -   -euc
            -   |
                export AEAD_SECRET_KEY="$$(cat /run/lmnr-secrets/aead_secret_key)"
                export CLICKHOUSE_PASSWORD="$$(cat /run/lmnr-secrets/clickhouse_password)"
                export DATABASE_URL="postgres://postgres:$$(cat /run/lmnr-secrets/postgres_password)@postgres:5432/postgres"
                export NEXTAUTH_SECRET="$$(cat /run/lmnr-secrets/nextauth_secret)"
                exec node server.js
        depends_on:
            init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            quickwit:
                condition: service_healthy
        environment:
            BACKEND_RT_URL: http://app-server:8002
            BACKEND_URL: http://app-server:8000
            CLICKHOUSE_URL: http://clickhouse:8123
            CLICKHOUSE_USER: ch_user
            # LITE disables some runtime dependencies.

            ENVIRONMENT: LITE
            LAMINAR_TELEMETRY_DISABLED: "true"
            NEXTAUTH_URL: http://localhost:9667
            NEXT_PUBLIC_URL: http://localhost:9667
            PORT: 5667
            QUICKWIT_SEARCH_URL: http://quickwit:7280
        image: ghcr.io/lmnr-ai/frontend:v0.2.5
        ports:
            -   "127.0.0.1:9667:5667"
        pull_policy: always
        volumes:
            -   init-secrets:/run/lmnr-secrets:ro
    # This service generates the app secrets and database passwords once, into
    # the init-secrets volume. Later starts reuse them, because rotating any of
    # them breaks stored keys, sessions, and database logins.

    init:
        command:
            -   sh
            -   -euc
            -   |
                umask 077
                for name in aead_secret_key clickhouse_password clickhouse_ro_password nextauth_secret postgres_password; do
                    if [ ! -s /secrets/$$name ]; then
                        od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "/secrets/$$name.tmp"
                        mv "/secrets/$$name.tmp" "/secrets/$$name"
                    fi
                done
                aead="$$(cat /secrets/aead_secret_key)"
                if echo "$$aead" | grep -q '[^0-9a-fA-F]'; then
                    aead=
                fi
                if [ $${#aead} -ne 64 ]; then
                    echo "init: \"/secrets/aead_secret_key\" must be exactly 64 hex characters (32 bytes)" >&2
                    exit 1
                fi
                chown 1001:1001 /secrets/*
        image: alpine:3
        volumes:
            -   init-secrets:/secrets
    liferay:
        environment:
            LIFERAY_ADMIN_PERIOD_EMAIL_PERIOD_FROM_PERIOD_ADDRESS: test@liferay.com
            LIFERAY_ADMIN_PERIOD_EMAIL_PERIOD_FROM_PERIOD_NAME: Test Test
            LIFERAY_AUTH_PERIOD_VERIFIER_PERIOD__UPPERCASEB_ASIC_UPPERCASEA_UTH_UPPERCASEH_EADER_UPPERCASEA_UTH_UPPERCASEV_ERIFIER_PERIOD_URLS_PERIOD_INCLUDES: /api/*,/xmlrpc/*,/o/*
            LIFERAY_COMPANY_PERIOD_DEFAULT_PERIOD_TIME_PERIOD_ZONE: UTC
            LIFERAY_COMPANY_PERIOD_DEFAULT_PERIOD_WEB_PERIOD_ID: liferay.com
            LIFERAY_CONFIGURATION_PERIOD_OVERRIDE_PERIOD_COM_PERIOD_LIFERAY_PERIOD_MCP_PERIOD_SERVER_PERIOD_REST_PERIOD_INTERNAL_PERIOD_CONFIGURATION_PERIOD__UPPERCASEM__UPPERCASEC__UPPERCASEP__UPPERCASES_ERVER_UPPERCASEC_ONFIGURATION_UNDERLINE_ENABLED: B"true"
            LIFERAY_DEFAULT_PERIOD_ADMIN_PERIOD_EMAIL_PERIOD_ADDRESS_PERIOD_PREFIX: test
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD__UPPERCASEL__UPPERCASEP__UPPERCASED__MINUS__NUMBER3__NUMBER5__NUMBER4__NUMBER4__NUMBER3_: "true"
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD__UPPERCASEL__UPPERCASEP__UPPERCASED__MINUS__NUMBER3__NUMBER9__NUMBER2__NUMBER4__NUMBER4_: "true"
            LIFERAY_FEATURE_PERIOD_FLAG_PERIOD__UPPERCASEL__UPPERCASEP__UPPERCASED__MINUS__NUMBER6__NUMBER3__NUMBER3__NUMBER1__NUMBER1_: "true"
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: org.postgresql.Driver
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: ""
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:postgresql://database:5432/lportal
            LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: postgres
            LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGE_PERIOD_REQUIRED: "false"
            LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"
            LIFERAY_TERMS_PERIOD_OF_PERIOD_USE_PERIOD_REQUIRED: "false"
            LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_ENABLED: "false"
    postgres:
        depends_on:
            init:
                condition: service_completed_successfully
        environment:
            POSTGRES_PASSWORD_FILE: /run/lmnr-secrets/postgres_password
        healthcheck:
            interval: 2s
            retries: 5
            test:
                -   CMD
                -   pg_isready
                -   --dbname
                -   postgres
                -   --username
                -   postgres
            timeout: 5s
        image: postgres:16
        ports:
            -   "127.0.0.1:9433:5432"
        pull_policy: always
        volumes:
            -   init-secrets:/run/lmnr-secrets:ro
            -   postgres-data:/var/lib/postgresql/data
    quickwit:
        build: ./lmnr/compose/quickwit
        command:
            -   run
        healthcheck:
            interval: 10s
            retries: 3
            test:
                -   CMD
                -   curl
                -   --fail
                -   http://localhost:7280/health/livez
            timeout: 5s
        # 9280 serves the REST API and the UI, and 9281 serves OTLP over gRPC.

        ports:
            -   "127.0.0.1:9280:7280"
            -   "127.0.0.1:9281:7281"
        pull_policy: build
        volumes:
            -   quickwit-data:/quickwit/qwdata
volumes:
    clickhouse-data:
    clickhouse-logs:
    init-secrets:
    postgres-data:
    quickwit-data: