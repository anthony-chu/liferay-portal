gradle.projectsEvaluated {
	String includeProperty = gradle.rootProject.findProperty("client.extensions.include") ?: ""

	String[] includeEntries = includeProperty.split(",")

	List<String> trimmedEntries = includeEntries.collect {
		it.trim()
	}

	List<String> includedClientExtensionNames = trimmedEntries.findAll {
		!it.isEmpty()
	}

	gradle.rootProject.subprojects.each {
		project ->

		File parentDir = project.projectDir.parentFile

		if ((parentDir.name != "client-extensions") || includedClientExtensionNames.contains(project.name)) {
			return
		}

		["buildDockerImage", "dockerDeploy"].each {
			taskName ->

			if (project.tasks.findByName(taskName) != null) {
				gradle.startParameter.excludedTaskNames.add(project.path + ":" + taskName)
			}
		}
	}
}